<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Minerva</title>

    <!-- 1. Tu CSS Global -->
    <link rel="stylesheet" href="/static/css/base.css">
    <!-- (O el nombre que tenga tu archivo global con las variables) -->

    <!-- 2. CSS Específico del Login -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <!-- La M de Minerva -->
                <div class="logo-icon">M</div>
                <h1>Bienvenido</h1>
                <p>Accede a la plataforma predictiva</p>
            </div>

            {% if error %}
            <div class="error-msg">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="post">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="username" class="form-input" placeholder="admin" required autofocus>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-input" placeholder="•••••" required>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <a href="/" class="back-link">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
