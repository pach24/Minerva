<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/media/minerva_app_icon.png">
    <title>Iniciar Sesión · Minerva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css?v=4">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img src="/static/media/minerva_app_icon.png" alt="Minerva">
                </div>
                <h1>Minerva</h1>
                <p>Accede a la plataforma predictiva</p>
            </div>

            {% if error %}
            <div class="error-msg">
                Credenciales incorrectas. Revisa tu email y contraseña.
            </div>
            {% endif %}

            <form action="/login" method="post">
                <div class="field-group">
                    <div class="field">
                        <input type="email" id="email" name="email" placeholder=" " required autofocus autocomplete="email">
                        <label for="email">Email</label>
                    </div>
                    <div class="field-divider"></div>
                    <div class="field">
                        <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
                        <label for="password">Contraseña</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Iniciar sesión</button>
            </form>

            <a href="/" class="btn-ghost">Volver al inicio</a>
        </div>

        <p class="login-footnote">Análisis predictivo de rendimiento académico</p>
    </div>
</body>
</html>
